Description: |
  Recorder captures meetings, lectures, interviews and ideas, and turns
  them into text you can search, without anything leaving your phone.
  It records in AAC or lossless WAV, transcribes live and afterwards with
  speech models you download for your language, labels speakers and sounds
  like music or applause, and lets you search every word you recorded.
  Play back at any speed with skip silence, trim recordings into copies,
  and share audio, transcripts, subtitles or video clips. Based on the
  LineageOS Recorder.

